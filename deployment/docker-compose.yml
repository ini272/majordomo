services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: majordomo-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NODE_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in /srv/majordomo/.env}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/majordomo.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SQL_ECHO: ${SQL_ECHO:-false}
    volumes:
      - ../data:/data
    networks:
      - majordomo

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: majordomo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - majordomo

networks:
  majordomo:
    driver: bridge
